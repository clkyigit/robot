name: Windows ekran paylaşımı

on:
  push:
    branches: [main]
    paths: ["laptop/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketler
        run: pip install pillow pyinstaller
      - name: EXE derle
        run: pyinstaller --onefile --noconsole --name RobotEkran laptop/ekran_paylas.py
      - name: Son sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          files: dist/RobotEkran.exe
