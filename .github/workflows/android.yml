name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk robot.apk

      # Telefondan kolayca indirmek için her derlemeyi "son-surum" sayfasına koyar
      - name: Son sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Robot uygulaması (son sürüm)
          body: "Otomatik derlendi: ${{ github.sha }}"
          make_latest: true
          files: robot.apk
